; Raises PHP's upload limits for the video-upload form. Works under
; PHP-FPM/CGI (what Hostinger and most shared hosts run) — .htaccess
; php_value directives do NOT work under FPM, .user.ini is the correct
; mechanism there. PHP-FPM reloads .user.ini every ~5 minutes by default,
; so a change here isn't instant. Your host's plan may still cap this
; lower regardless (check hPanel's PHP configuration screen if uploads
; over a certain size fail).
upload_max_filesize = 200M
post_max_size = 210M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
